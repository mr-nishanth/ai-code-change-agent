[project]
name = "ai-code-change-agent"
version = "0.1.0"
description = "Jira-driven AI Code Change Agent: one LangGraph workflow, one Deep Agent and an independent Python validation engine, delivering draft pull requests to authorised repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "structlog>=24.4",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.0",
    "deepagents>=0.7.41",
    "langchain-anthropic>=1.7",
    "langchain-aws>=1.0",
]

[project.scripts]
ai-code-change = "ai_code_change_agent.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
studio = [
    "langgraph-cli[inmem]>=0.4.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_change_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "studio"]
extend-exclude = ["var"]  # workspaces, artifacts and third-party dependency bundles

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "ASYNC", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # synthetic secrets, long data literals
"src/ai_code_change_agent/persistence/migrations/versions/**" = ["E501"]  # generated DDL

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "studio"]
exclude = ["^src/ai_code_change_agent/persistence/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=ai_code_change_agent --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: needs the project's PostgreSQL (compose service on 127.0.0.1:5435)",
    "docker: needs Docker and the local execution image (skipped with a reason otherwise)",
]

[tool.coverage.run]
branch = true
omit = ["src/ai_code_change_agent/persistence/migrations/*"]
