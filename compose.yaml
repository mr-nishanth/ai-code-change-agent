# Local development stack for ai-code-change-agent (independent of any other project).
# The application stores everything in DynamoDB, SQS and S3: locally the Floci emulator
# (infra/docker-compose.yml, its own compose project and the external `acca-floci` network; start it
# and run its bootstrap first). The `postgres` service is no longer used by the application and
# nothing depends on it; it is removed with the rest of PostgreSQL later.
# The worker is NOT a service here: it runs on the host with `uv run ai-code-change worker`
# because it controls the Docker daemon for execution sandboxes (see docs/ARCHITECTURE.md).
name: ai-code-change-agent
services:
  postgres:
    image: postgres:16
    container_name: acca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acca
      POSTGRES_PASSWORD: acca_dev_only
      POSTGRES_DB: ai_code_change_agent
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - acca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acca -d ai_code_change_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: ${ACCA_API_CONTAINER_NAME:-acca-api}
    # Least privilege: the API only receives what webhook intake needs (values are interpolated
    # from .env by compose). No GitHub App, LLM or Jira REST credentials enter this container.
    # It reaches only DynamoDB (the application table) on Floci, by its Docker name, never
    # localhost; with the endpoint override the clients use Floci's dummy credentials test/test.
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      JIRA_PROJECT_KEYS: ${JIRA_PROJECT_KEYS:-}
      JIRA_STORY_ISSUE_TYPES: ${JIRA_STORY_ISSUE_TYPES:-Story}
      JIRA_WEBHOOK_EVENT: ${JIRA_WEBHOOK_EVENT:-jira:issue_created}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      ACCA_AWS_ENDPOINT_URL: http://acca-floci:4566
      ACCA_DYNAMODB_TABLE_NAME: ${ACCA_DYNAMODB_TABLE_NAME:-acca-local-app}
    ports:
      - "127.0.0.1:${ACCA_API_PORT:-8000}:8000"
    networks: [acca-floci]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  acca-floci: # created by infra/docker-compose.yml (Floci)
    external: true
    name: acca-floci

volumes:
  acca_pgdata:
